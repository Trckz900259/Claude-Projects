[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbplatform"
version = "0.1.0"
description = "A modular framework for AUTHORIZED bug-bounty security testing (foundation + XSS module)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bug Bounty Platform" }]

# Runtime deps are pinned in requirements.txt so beginners have one obvious
# place to look. This list mirrors the essentials for `pip install -e .`.
dependencies = [
    "PyYAML>=6.0.1",
    "requests>=2.31.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "Jinja2>=3.1.3",
    "Markdown>=3.6",
]

[project.scripts]
# After `pip install -e .` you can run the platform simply as: `bbp ...`
bbp = "cli:app"

[tool.setuptools]
# We honour the requested top-level layout (/core, /recon, ...) by declaring
# each directory as an importable package. Imports look like `from core.config`.
packages = [
    "core",
    "recon",
    "modules",
    "modules.xss",
    "modules.accesscontrol",
    "verify",
    "report",
    "dashboard",
    "orchestrator",
]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
